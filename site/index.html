:root {
  --background: #040A1C;
  --foreground: #F2F5F9;
  --primary: #2166F3;
  --secondary: #00CFFF;
}
@layer base {
  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
  }
  html, body {
    overflow-x: clip;
  }
  body {
    background: var(--color-navy);
    color: var(--color-mist);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  section, footer {
    scroll-margin-top: 76px;
  }
  ::selection {
    background: rgba(33, 102, 243, 0.45);
    color: #fff;
  }
  :focus-visible {
    outline: 2px solid var(--color-cyan);
    outline-offset: 3px;
  }
}
@layer components {
  .text-gradient {
    background: linear-gradient(100deg, #2166F3 0%, #00CFFF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .btn-primary {
    background: linear-gradient(135deg, #2166F3 0%, #1A55D6 100%);
    box-shadow: 0 10px 30px -8px rgba(33, 102, 243, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 40px -8px rgba(33, 102, 243, 0.85), 0 0 0 4px rgba(0, 207, 255, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .btn-ghost {
    border: 1px solid rgba(220, 227, 239, 0.22);
    background: rgba(255, 255, 255, 0.03);
    transition: border-color .25s ease, background .25s ease, transform .25s ease;
  }
  .btn-ghost:hover {
    border-color: rgba(0, 207, 255, 0.6);
    background: rgba(0, 207, 255, 0.06);
    transform: translateY(-2px);
  }
  .nav-link {
    position: relative;
  }
  .nav-link::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -6px;
    height: 2px;
    border-radius: 2px;
    background: var(--color-cyan);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .3s ease;
  }
  .nav-link:hover::after {
    transform: scaleX(1);
  }
  .glass {
    background: rgba(7, 19, 47, 0.62);
    border: 1px solid rgba(220, 227, 239, 0.12);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 40px -18px rgba(0, 0, 0, 0.6);
  }
  .card {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.045) 0%, rgba(255, 255, 255, 0.015) 100%);
    border: 1px solid rgba(220, 227, 239, 0.09);
    transition: border-color .3s ease, transform .3s ease, box-shadow .3s ease;
  }
  .card:hover {
    border-color: rgba(33, 102, 243, 0.55);
    box-shadow: 0 24px 50px -24px rgba(33, 102, 243, 0.55);
  }
  .service-card {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.015) 100%);
    border: 1px solid rgba(220, 227, 239, 0.1);
    transition: border-color .35s ease, transform .35s ease, box-shadow .35s ease;
  }
  .service-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(400px circle at 50% 0%, rgba(0, 207, 255, 0.14), transparent 60%);
    opacity: 0;
    transition: opacity .35s ease;
  }
  .service-card:hover {
    transform: translateY(-6px);
    border-color: rgba(0, 207, 255, 0.45);
    box-shadow: 0 30px 60px -28px rgba(33, 102, 243, 0.8);
  }
  .service-card:hover::before {
    opacity: 1;
  }
  .icon-tile {
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    border-radius: 16px;
    color: #fff;
    background: linear-gradient(135deg, #2166F3 0%, #1747B8 100%);
    box-shadow: 0 0 0 1px rgba(0, 207, 255, 0.25), 0 10px 26px -8px rgba(33, 102, 243, 0.8);
  }
  .diff-hero {
    background: radial-gradient(120% 90% at 0% 0%, rgba(0, 207, 255, 0.18) 0%, transparent 55%), linear-gradient(150deg, #0E2A6B 0%, #07132F 75%);
    border: 1px solid rgba(0, 207, 255, 0.18);
  }
  .cta-box {
    background: linear-gradient(135deg, #2166F3 0%, #1A4FD0 55%, #123A9E 100%);
  }
  .hero-lines {
    background-image: linear-gradient(rgba(33, 102, 243, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(33, 102, 243, 0.07) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 70% 60% at 70% 40%, #000 0%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 70% 40%, #000 0%, transparent 75%);
  }
  .cta-grid {
    background-image: linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at center, #000 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 0%, transparent 70%);
  }
}
.reveal {
  opacity: 0;
  transform: translateY(26px);
  transition: opacity .8s cubic-bezier(.2, .7, .2, 1), transform .8s cubic-bezier(.2, .7, .2, 1);
}
.reveal-in {
  opacity: 1;
  transform: none;
}
.synapse {
  stroke-dasharray: 10 18;
  animation: synapse 3.2s linear infinite;
}
@keyframes synapse {
  to {
    stroke-dashoffset: -112;
  }
}
.trace {
  stroke-dasharray: 14 100;
  animation: trace 2.6s linear infinite;
}
@keyframes trace {
  from {
    stroke-dashoffset: 114;
  }
  to {
    stroke-dashoffset: 0;
  }
}
.twinkle {
  transform-box: fill-box;
  transform-origin: center;
  animation: twinkle 2.8s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: .35;
    transform: scale(.7);
  }
}
.pulse-glow {
  animation: pulse-glow 4s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: .65;
  }
}
.float-slow {
  animation: float-slow 6s ease-in-out infinite;
}
@keyframes float-slow {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}
.float-chip {
  animation: float-chip 5s ease-in-out infinite;
}
.float-chip-alt {
  animation: float-chip 5s ease-in-out -2.5s infinite;
}
@keyframes float-chip {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-8px);
  }
}
.brand-chip, .dock, .glass-chip {
  background: rgba(7, 19, 47, 0.55);
  border: 1px solid rgba(220, 227, 239, 0.1);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  backdrop-filter: blur(16px) saturate(140%);
  box-shadow: 0 10px 40px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
.brand-word {
  max-width: 140px;
  transition: max-width .6s cubic-bezier(.22,1,.36,1), opacity .4s ease;
}
.is-compact .brand-word {
  max-width: 0;
  opacity: 0;
}
.dock-pill {
  left: 6px;
  background: linear-gradient(135deg, rgba(33,102,243,.9), rgba(26,85,214,.9));
  box-shadow: 0 6px 20px -6px rgba(33,102,243,.8), inset 0 1px 0 rgba(255,255,255,.2);
  transition: transform .5s cubic-bezier(.34,1.4,.64,1), width .5s cubic-bezier(.34,1.4,.64,1), opacity .3s ease;
}
@property --angle {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}
.cta-ring {
  isolation: isolate;
  background: rgba(7, 19, 47, 0.7);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
}
.cta-ring::before {
  content: "";
  position: absolute;
  inset: -1.5px;
  border-radius: inherit;
  z-index: -1;
  padding: 1.5px;
  background: conic-gradient(from var(--angle), transparent 0 55%, #00CFFF 75%, #2166F3 90%, transparent 100%), rgba(220,227,239,.14);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  animation: spin-angle 3.5s linear infinite;
}
.cta-ring:hover::before {
  animation-duration: 1.4s;
}
@keyframes spin-angle {
  to {
    --angle: 360deg;
  }
}
.burger-line {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 20px;
  height: 2px;
  margin: -1px 0 0 -10px;
  border-radius: 2px;
  background: #fff;
  transition: translate .4s cubic-bezier(.22,1,.36,1), rotate .4s cubic-bezier(.22,1,.36,1);
}
.mobile-overlay {
  clip-path: circle(0px at calc(100% - 40px) 44px);
  pointer-events: none;
  visibility: hidden;
  transition: clip-path .7s cubic-bezier(.77,0,.18,1), visibility 0s linear .7s;
}
.mobile-overlay.is-open {
  clip-path: circle(150% at calc(100% - 40px) 44px);
  pointer-events: auto;
  visibility: visible;
  transition: clip-path .8s cubic-bezier(.77,0,.18,1), visibility 0s;
}
.mobile-link {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity .5s ease, transform .6s cubic-bezier(.22,1,.36,1);
}
.is-open .mobile-link {
  opacity: 1;
  transform: none;
}
.word-mask {
  display: inline-block;
  overflow: hidden;
  vertical-align: bottom;
  padding-bottom: .08em;
  margin-bottom: -.08em;
}
.word {
  display: inline-block;
  transform: translateY(110%);
  transition: transform .9s cubic-bezier(.22,1,.36,1);
}
.words-in .word {
  transform: none;
}
.rotator {
  position: relative;
  display: inline-grid;
  overflow: hidden;
  vertical-align: bottom;
}
.rotator > * {
  grid-area: 1 / 1;
}
.rotator-word {
  transform: translateY(105%);
  opacity: 0;
  transition: transform .6s cubic-bezier(.22,1,.36,1), opacity .4s ease;
  white-space: nowrap;
}
.rotator-word.is-active {
  transform: none;
  opacity: 1;
}
.rotator-word.is-leaving {
  transform: translateY(-105%);
  opacity: 0;
}
.rotator .invisible {
  white-space: nowrap;
}
.tilt-card {
  position: relative;
  transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.22,1,.36,1), border-color .4s ease, box-shadow .4s ease;
  will-change: transform;
}
.tilt-spot {
  pointer-events: none;
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: 0;
  transition: opacity .4s ease;
  background: radial-gradient(360px circle at var(--mx, 50%) var(--my, 50%), rgba(0, 207, 255, 0.13), transparent 55%);
}
.tilt-card:hover .tilt-spot {
  opacity: 1;
}
.marquee {
  animation: marquee 38s linear infinite;
}
.marquee-rev {
  animation: marquee 46s linear infinite reverse;
}
@keyframes marquee {
  to {
    transform: translateX(-50%);
  }
}
.text-outline {
  color: transparent;
  -webkit-text-stroke: 1.2px rgba(220, 227, 239, 0.45);
}
.reveal-left {
  transform: translateX(-36px);
}
.reveal-scale {
  transform: translateY(30px) scale(.94);
}
.reveal-left.reveal-in, .reveal-scale.reveal-in {
  transform: none;
}
.btn-shine {
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
.btn-shine::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
  transform: translateX(-120%);
  animation: shine 4.5s ease-in-out 1.5s infinite;
}
@keyframes shine {
  0%, 60% {
    transform: translateX(-120%);
  }
  85%, 100% {
    transform: translateX(120%);
  }
}
.scroll-cue {
  width: 26px;
  height: 42px;
  border-radius: 14px;
  border: 1.5px solid rgba(220,227,239,.3);
  justify-content: center;
  padding-top: 8px;
  z-index: 5;
}
.scroll-cue-dot {
  width: 4px;
  height: 8px;
  border-radius: 2px;
  background: #00CFFF;
  animation: cue 1.8s cubic-bezier(.6,0,.4,1) infinite;
}
@keyframes cue {
  0% {
    transform: translateY(0);
    opacity: 1;
  }
  80% {
    transform: translateY(14px);
    opacity: 0;
  }
  100% {
    opacity: 0;
  }
}
.spin-slow {
  animation: spin 60s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.icon-pulse {
  position: relative;
}
.icon-pulse::after {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  border: 1px solid rgba(0,207,255,.5);
  animation: ring 2.8s ease-out infinite;
}
@keyframes ring {
  0% {
    transform: scale(1);
    opacity: .8;
  }
  100% {
    transform: scale(1.45);
    opacity: 0;
  }
}
.diff-scan {
  background: linear-gradient(180deg, transparent, rgba(0,207,255,.12) 50%, transparent);
  height: 40%;
  animation: scan 5s ease-in-out infinite;
}
@keyframes scan {
  0% {
    transform: translateY(-100%);
  }
  100% {
    transform: translateY(260%);
  }
}
.cta-orb {
  animation: orb 9s ease-in-out infinite;
}
.cta-orb-alt {
  animation: orb 11s ease-in-out -4s infinite reverse;
}
@keyframes orb {
  0%, 100% {
    transform: translate(0, 0) scale(1);
  }
  50% {
    transform: translate(60px, 30px) scale(1.15);
  }
}
.project-shot {
  transition: transform 1.2s cubic-bezier(.22,1,.36,1);
}
.project:hover .project-shot {
  transform: scale(1.04);
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  .reveal, .reveal-left, .reveal-scale {
    opacity: 1;
    transform: none;
    transition: none;
  }
  .synapse, .trace, .twinkle, .pulse-glow, .float-slow, .float-chip, .float-chip-alt, .marquee, .marquee-rev, .btn-shine::after, .scroll-cue-dot, .spin-slow, .icon-pulse::after, .diff-scan, .cta-orb, .cta-orb-alt, .cta-ring::before {
    animation: none;
  }
  .word {
    transform: none;
    transition: none;
  }
  .rotator-word {
    transition: none;
  }
  .tilt-card {
    transition: none;
  }
}

.cinematic-footer-wrapper {
  -webkit-font-smoothing: antialiased;
  --pill-bg-1: color-mix(in oklch, var(--foreground) 4%, transparent);
  --pill-bg-2: color-mix(in oklch, var(--foreground) 1%, transparent);
  --pill-shadow: color-mix(in oklch, var(--background) 50%, transparent);
  --pill-highlight: color-mix(in oklch, var(--foreground) 10%, transparent);
  --pill-inset-shadow: color-mix(in oklch, var(--background) 80%, transparent);
  --pill-border: color-mix(in oklch, var(--foreground) 9%, transparent);
  --pill-bg-1-hover: color-mix(in oklch, var(--primary) 22%, transparent);
  --pill-bg-2-hover: color-mix(in oklch, var(--foreground) 3%, transparent);
  --pill-border-hover: color-mix(in oklch, var(--secondary) 45%, transparent);
  --pill-shadow-hover: color-mix(in oklch, var(--primary) 35%, transparent);
  --pill-highlight-hover: color-mix(in oklch, var(--foreground) 20%, transparent);
}
@keyframes footer-breathe {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
  100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
}
@keyframes footer-scroll-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes footer-heartbeat {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px color-mix(in oklch, var(--secondary) 45%, transparent)); }
  15%, 45% { transform: scale(1.22); filter: drop-shadow(0 0 10px color-mix(in oklch, var(--secondary) 85%, transparent)); }
  30% { transform: scale(1); }
}
.animate-footer-breathe { animation: footer-breathe 8s ease-in-out infinite alternate; }
.animate-footer-scroll-marquee { animation: footer-scroll-marquee 40s linear infinite; }
.animate-footer-heartbeat { animation: footer-heartbeat 2s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
.footer-bg-grid {
  background-size: 60px 60px;
  background-image:
    linear-gradient(to right, color-mix(in oklch, var(--primary) 9%, transparent) 1px, transparent 1px),
    linear-gradient(to bottom, color-mix(in oklch, var(--primary) 9%, transparent) 1px, transparent 1px);
  mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
  -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
}
.footer-aurora {
  background: radial-gradient(circle at 50% 50%,
    color-mix(in oklch, var(--primary) 30%, transparent) 0%,
    color-mix(in oklch, var(--secondary) 14%, transparent) 40%,
    transparent 70%);
}
.footer-glass-pill {
  background: linear-gradient(145deg, var(--pill-bg-1) 0%, var(--pill-bg-2) 100%);
  box-shadow: 0 10px 30px -10px var(--pill-shadow), inset 0 1px 1px var(--pill-highlight), inset 0 -1px 2px var(--pill-inset-shadow);
  border: 1px solid var(--pill-border);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: background 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s, box-shadow 0.4s, color 0.4s;
}
.footer-glass-pill:hover {
  background: linear-gradient(145deg, var(--pill-bg-1-hover) 0%, var(--pill-bg-2-hover) 100%);
  border-color: var(--pill-border-hover);
  box-shadow: 0 20px 40px -10px var(--pill-shadow-hover), inset 0 1px 1px var(--pill-highlight-hover);
  color: var(--foreground);
}
.footer-giant-bg-text {
  font-size: 26vw; line-height: 0.75; font-weight: 900; letter-spacing: -0.05em;
  color: transparent;
  -webkit-text-stroke: 1px color-mix(in oklch, var(--secondary) 12%, transparent);
  background: linear-gradient(180deg, color-mix(in oklch, var(--primary) 26%, transparent) 0%, transparent 62%);
  -webkit-background-clip: text; background-clip: text;
}
.footer-text-glow {
  background: linear-gradient(180deg, var(--foreground) 0%, color-mix(in oklch, var(--foreground) 45%, transparent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 0 22px color-mix(in oklch, var(--primary) 35%, transparent));
}
@media (prefers-reduced-motion: reduce) {
